[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unsupervised-matrix"
version = "2.1.0"
description = "Master Clustering Intelligence Reference Framework"
authors = [
  { name="Devanik", email="devanik21@example.com" },
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "plotly>=5.3.0",
    "streamlit>=1.10.0"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
